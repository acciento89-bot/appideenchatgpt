name: Trace Empty Release Build 2 Patch

on:
  push:
    branches:
      - fix/002-trace-empty-release-build2
    paths:
      - '.github/workflows/trace-empty-release-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/002-trace-empty-release-build2

      - name: Apply guarded release patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new))

          app = Path('apps/002-evidaro/prototype/EvidaroPrototype/EvidaroPrototypeApp.swift')
          old_init = '''    init() {
          #if DEBUG
                  let arguments = CommandLine.arguments
                  let smokeRequested = arguments.contains("--evidaro-persistence-smoke")
                      || arguments.contains("--evidaro-verification-bundle-smoke")
          #else
                  let smokeRequested = false
          #endif
                  _store = StateObject(wrappedValue: EvidenceStore(seedDemoData: !smokeRequested))
              }'''.replace('          #', '#').replace('                  ', '        ').replace('              }', '    }')
          new_init = '''    init() {
          #if DEBUG
                  let arguments = CommandLine.arguments
                  let smokeRequested = arguments.contains("--evidaro-persistence-smoke")
                      || arguments.contains("--evidaro-verification-bundle-smoke")
                  let seedDemoData = !smokeRequested
          #else
                  let seedDemoData = false
          #endif
                  _store = StateObject(wrappedValue: EvidenceStore(seedDemoData: seedDemoData))
              }'''.replace('          #', '#').replace('                  ', '        ').replace('              }', '    }')
          replace_once(app, old_init, new_init, 'release seed boundary')

          project = Path('apps/002-evidaro/prototype/EvidaroPrototype.xcodeproj/project.pbxproj')
          text = project.read_text()
          count = text.count('CURRENT_PROJECT_VERSION = 1;')
          if count != 2:
              raise SystemExit(f'build number: expected 2 Build 1 settings, found {count}')
          project.write_text(text.replace('CURRENT_PROJECT_VERSION = 1;', 'CURRENT_PROJECT_VERSION = 2;'))

          preflight = Path('apps/002-evidaro/ci/release_preflight.py')
          text = preflight.read_text()
          old = 'STATIC_WORKFLOW = ROOT / ".github/workflows/kamilunavo-trace-static-release.yml"\n'
          new = old + 'APP_ENTRY = APP / "EvidaroPrototypeApp.swift"\n'
          if text.count(old) != 1:
              raise SystemExit('preflight APP_ENTRY anchor mismatch')
          text = text.replace(old, new)

          old = '    STATIC_WORKFLOW,\n]\n'
          new = '    STATIC_WORKFLOW,\n    APP_ENTRY,\n]\n'
          if text.count(old) != 1:
              raise SystemExit('preflight required anchor mismatch')
          text = text.replace(old, new)

          old = 'static_workflow = STATIC_WORKFLOW.read_text()\n\nchecks: dict[str, bool] = {\n'
          new = 'static_workflow = STATIC_WORKFLOW.read_text()\napp_entry = APP_ENTRY.read_text()\n\nchecks: dict[str, bool] = {\n'
          if text.count(old) != 1:
              raise SystemExit('preflight read anchor mismatch')
          text = text.replace(old, new)

          old = '    "release bundle id": BUNDLE_ID in project,\n'
          new = old + '    "release build starts without demo evidence": (\n        "let seedDemoData = false" in app_entry\n        and "EvidenceStore(seedDemoData: seedDemoData)" in app_entry\n        and "EvidenceStore(seedDemoData: !smokeRequested)" not in app_entry\n    ),\n'
          if text.count(old) != 1:
              raise SystemExit('preflight check anchor mismatch')
          preflight.write_text(text.replace(old, new))

      - name: Verify exact patch
        run: |
          grep -q 'let seedDemoData = false' apps/002-evidaro/prototype/EvidaroPrototype/EvidaroPrototypeApp.swift
          ! grep -q 'EvidenceStore(seedDemoData: !smokeRequested)' apps/002-evidaro/prototype/EvidaroPrototype/EvidaroPrototypeApp.swift
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 2;' apps/002-evidaro/prototype/EvidaroPrototype.xcodeproj/project.pbxproj)" = 2
          python3 apps/002-evidaro/ci/release_preflight.py

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/002-evidaro/prototype/EvidaroPrototype/EvidaroPrototypeApp.swift \
                  apps/002-evidaro/prototype/EvidaroPrototype.xcodeproj/project.pbxproj \
                  apps/002-evidaro/ci/release_preflight.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: start Trace release builds without demo evidence'
          git push origin HEAD:fix/002-trace-empty-release-build2
