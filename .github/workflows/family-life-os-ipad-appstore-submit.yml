name: Family Life OS iPad Screenshots + Final App Review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-life-os-ipad-appstore-submit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: '6803079524'
  VERSION_ID: 'e7a061e3-bd05-453c-a911-00e1e8cb4f76'
  VLOC_ID: '557ca16e-28b4-44d0-83ec-11d8890f0376'
  BUNDLE_ID: 'de.kamilunavo.familyprototype'
  PROJECT_DIR: 'apps/011-family-life-os/prototype'
  XCODE_PROJECT: 'FamilyLifePrototype.xcodeproj'
  SCHEME: 'FamilyLifePrototype'
  REVIEW_SUBMISSION_ID: '3b4e487e-d776-471e-abff-0fae824a72cd'

jobs:
  finish:
    name: Generate iPad screenshots and submit Build 8
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          header=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          payload=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+1200,aud:'appstoreconnect-v1'})); signing="#{header}.#{payload}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,signing))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{signing}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project "$XCODE_PROJECT" -scheme "$SCHEME" -resolvePackageDependencies

      - name: Create 12.9-inch iPad simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable==true and (.name|startswith("iOS")))] | sort_by(.version) | last | .identifier')
          TYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name|test("iPad Pro \\(12.9-inch\\)"))] | last | .identifier')
          test -n "$RUNTIME"; test "$RUNTIME" != null
          test -n "$TYPE"; test "$TYPE" != null
          UDID=$(xcrun simctl create 'FamilyLife-AppStore-iPad' "$TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "device_type=$TYPE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build Family Life OS for iPad Simulator
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP=$(find "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"; test -d "$APP"
          echo "SIM_APP=$APP" >> "$GITHUB_ENV"

      - name: Capture real iPad App Store screenshots
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/family-ipad-shots"
          xcrun simctl install "$UDID" "$SIM_APP"

          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" >/dev/null
          sleep 7
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/family-ipad-shots/Family-Life-OS-iPad-01.png"

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -familyProReviewScreenshot >/dev/null
          sleep 3
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/family-ipad-shots/Family-Life-OS-iPad-02-Family-Pro.png"

          for f in "$RUNNER_TEMP"/family-ipad-shots/*.png; do
            echo "$(basename "$f") $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixelWidth|pixelHeight/{printf $2 "x"}' | sed 's/x$//')"
            test "$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')" = '2048'
            test "$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')" = '2732'
          done

      - name: Upload iPad screenshots to App Store Connect
        shell: bash
        env:
          SHOT_DIR: ${{ runner.temp }}/family-ipad-shots
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request, urllib.error

          BASE='https://api.appstoreconnect.apple.com/v1'
          TOKEN=os.environ['ASC_TOKEN']
          VLOC=os.environ['VLOC_ID']
          SHOT_DIR=pathlib.Path(os.environ['SHOT_DIR'])
          files=[SHOT_DIR/'Family-Life-OS-iPad-01.png', SHOT_DIR/'Family-Life-OS-iPad-02-Family-Pro.png']

          def api(method, path, body=None):
              headers={'Authorization': f'Bearer {TOKEN}', 'Accept':'application/json'}
              data=None
              if body is not None:
                  headers['Content-Type']='application/json'
                  data=json.dumps(body).encode()
              req=urllib.request.Request(BASE+path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      raw=r.read()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  raise RuntimeError(f'{method} {path} -> HTTP {e.code}: {raw}')

          _, sets=api('GET', f'/appStoreVersionLocalizations/{VLOC}/appScreenshotSets?limit=50')
          set_id=None
          for s in sets.get('data',[]):
              if s.get('attributes',{}).get('screenshotDisplayType')=='APP_IPAD_PRO_3GEN_129':
                  set_id=s['id']; break
          if not set_id:
              body={'data':{'type':'appScreenshotSets','attributes':{'screenshotDisplayType':'APP_IPAD_PRO_3GEN_129'},'relationships':{'appStoreVersionLocalization':{'data':{'type':'appStoreVersionLocalizations','id':VLOC}}}}}
              _, created=api('POST','/appScreenshotSets',body)
              set_id=created['data']['id']
              print('Created iPad screenshot set',set_id)
          else:
              print('Using iPad screenshot set',set_id)

          _, existing=api('GET', f'/appScreenshotSets/{set_id}/appScreenshots?limit=50')
          by_name={x.get('attributes',{}).get('fileName'):x for x in existing.get('data',[])}

          for path in files:
              name=path.name
              ex=by_name.get(name)
              if ex and ex.get('attributes',{}).get('assetDeliveryState',{}).get('state')=='COMPLETE':
                  print('Already complete:',name)
                  continue
              if ex:
                  api('DELETE', f"/appScreenshots/{ex['id']}")
              raw=path.read_bytes()
              body={'data':{'type':'appScreenshots','attributes':{'fileName':name,'fileSize':len(raw)},'relationships':{'appScreenshotSet':{'data':{'type':'appScreenshotSets','id':set_id}}}}}
              _, reservation=api('POST','/appScreenshots',body)
              shot=reservation['data']; sid=shot['id']; ops=shot['attributes']['uploadOperations']
              for op in ops:
                  offset=int(op['offset']); length=int(op['length']); chunk=raw[offset:offset+length]
                  headers={h['name']:h['value'] for h in op.get('requestHeaders',[])}
                  req=urllib.request.Request(op['url'],data=chunk,headers=headers,method=op['method'])
                  with urllib.request.urlopen(req,timeout=180) as r:
                      if not (200 <= r.status < 300): raise RuntimeError(f'upload {name}: HTTP {r.status}')
              md5=hashlib.md5(raw).hexdigest()
              api('PATCH',f'/appScreenshots/{sid}',{'data':{'type':'appScreenshots','id':sid,'attributes':{'uploaded':True,'sourceFileChecksum':md5}}})
              state=''
              for _ in range(45):
                  time.sleep(2)
                  _, check=api('GET',f'/appScreenshots/{sid}')
                  state=check['data']['attributes']['assetDeliveryState']['state']
                  print(name,state)
                  if state=='COMPLETE': break
                  if state=='FAILED': raise RuntimeError(json.dumps(check['data']['attributes']['assetDeliveryState']))
              if state!='COMPLETE': raise RuntimeError(f'{name} did not reach COMPLETE; last={state}')

          _, final=api('GET', f'/appScreenshotSets/{set_id}/appScreenshots?limit=50')
          complete=[x for x in final.get('data',[]) if x.get('attributes',{}).get('assetDeliveryState',{}).get('state')=='COMPLETE']
          if len(complete)<2: raise RuntimeError(f'Expected >=2 COMPLETE iPad screenshots, got {len(complete)}')
          print('iPad screenshots COMPLETE:',len(complete))
          PY

      - name: Attach exact Build 8 to version 1.0
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          BUILDS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds?filter%5Bapp%5D=$APP_ID&filter%5Bversion%5D=8&sort=-uploadedDate&limit=10")
          BUILD_ID=$(jq -r '.data[0].id // empty' <<<"$BUILDS")
          test -n "$BUILD_ID"
          BUILD=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/builds/$BUILD_ID")
          test "$(jq -r '.data.attributes.version' <<<"$BUILD")" = '8'
          test "$(jq -r '.data.attributes.processingState' <<<"$BUILD")" = 'VALID'
          BODY=$(jq -n --arg id "$BUILD_ID" '{data:{type:"builds",id:$id}}')
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/appStoreVersions/$VERSION_ID/relationships/build" >/dev/null
          echo "Build 8 attached: $BUILD_ID"

      - name: Add App Version 1.0 to the Family Pro review package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          SID="$REVIEW_SUBMISSION_ID"
          SUB=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
          STATE=$(jq -r '.data.attributes.state // empty' <<<"$SUB")
          if [[ "$STATE" != 'READY_FOR_REVIEW' ]]; then
            ALL=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/apps/$APP_ID/reviewSubmissions?filter%5Bplatform%5D=IOS&filter%5Bstate%5D=READY_FOR_REVIEW&limit=50")
            SID=$(jq -r '.data[0].id // empty' <<<"$ALL")
          fi
          test -n "$SID"
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?limit=200")
          HAVE=$(jq -r --arg vid "$VERSION_ID" '[.data[]? | select(.relationships.appStoreVersion.data.id==$vid)] | length' <<<"$ITEMS")
          if [[ "$HAVE" -eq 0 ]]; then
            BODY=$(jq -n --arg sid "$SID" --arg vid "$VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$sid}},appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissionItems" >/dev/null
          fi
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?limit=200")
          HAVE=$(jq -r --arg vid "$VERSION_ID" '[.data[]? | select(.relationships.appStoreVersion.data.id==$vid)] | length' <<<"$ITEMS")
          SUBS=$(jq '[.data[]? | select(.relationships.subscriptionVersion.data.id != null)] | length' <<<"$ITEMS")
          echo "Review package: app-version=$HAVE subscription-items=$SUBS total=$(jq '.data|length' <<<"$ITEMS")"
          test "$HAVE" -ge 1
          test "$SUBS" -ge 2
          echo "submission_id=$SID" >> "$GITHUB_OUTPUT"

      - name: Submit everything to Apple App Review
        id: submit
        shell: bash
        env:
          SID: ${{ steps.package.outputs.submission_id }}
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          BEFORE=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
          STATE=$(jq -r '.data.attributes.state // empty' <<<"$BEFORE")
          echo "Before submit: $STATE"
          if [[ "$STATE" == 'READY_FOR_REVIEW' ]]; then
            BODY=$(jq -n --arg id "$SID" '{data:{type:"reviewSubmissions",id:$id,attributes:{submitted:true}}}')
            curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissions/$SID" >/dev/null
          fi
          FINAL=''
          for i in {1..45}; do
            sleep 4
            R=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
            FINAL=$(jq -r '.data.attributes.state // empty' <<<"$R")
            echo "Apple Review state: $FINAL"
            case "$FINAL" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) break ;; esac
          done
          case "$FINAL" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) ;; *) exit 1 ;; esac
          echo "final_state=$FINAL" >> "$GITHUB_OUTPUT"
          echo "### Family Life OS 1.0 komplett an Apple übermittelt ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: **8**" >> "$GITHUB_STEP_SUMMARY"
          echo "- iPad Pro 12.9\" Screenshots: **2 COMPLETE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Family Pro Monthly + Annual: **im selben Review-Paket**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apple Status: **$FINAL**" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve iPad screenshots as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-life-os-ipad-appstore-screenshots
          path: ${{ runner.temp }}/family-ipad-shots/*.png
          if-no-files-found: ignore
          retention-days: 14
