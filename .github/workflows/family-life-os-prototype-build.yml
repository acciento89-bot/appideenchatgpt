name: Family Life OS Prototype Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/011-family-life-os/prototype/**'
      - '.github/workflows/family-life-os-prototype-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/011-family-life-os/prototype/**'
      - '.github/workflows/family-life-os-prototype-build.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Family Life OS prototype for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/011-family-life-os/prototype/FamilyLifePrototype.xcodeproj \
            -scheme FamilyLifePrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
