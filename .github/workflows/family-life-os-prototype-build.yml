name: Family Life OS Prototype Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/011-family-life-os/prototype/**'
      - 'apps/011-family-life-os/ci/family_app_icon.swift'
      - 'apps/011-family-life-os/supabase/functions/process-family-source/**'
      - 'apps/011-family-life-os/supabase/functions/delete-family-data/**'
      - '.github/workflows/family-life-os-prototype-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/011-family-life-os/prototype/**'
      - 'apps/011-family-life-os/ci/family_app_icon.swift'
      - 'apps/011-family-life-os/supabase/functions/process-family-source/**'
      - 'apps/011-family-life-os/supabase/functions/delete-family-data/**'
      - '.github/workflows/family-life-os-prototype-build.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test household timezone conversion
        run: node --test apps/011-family-life-os/supabase/functions/process-family-source/timezone.test.mjs

      - name: Test explicit clock parsing
        run: node --test apps/011-family-life-os/supabase/functions/process-family-source/clock-time.test.mjs

      - name: Test account deletion request policy
        run: node --test apps/011-family-life-os/supabase/functions/delete-family-data/policy.test.mjs

      - name: Test proposal review blockers
        run: |
          swiftc \
            apps/011-family-life-os/prototype/FamilyLifePrototype/Domain/Models.swift \
            apps/011-family-life-os/prototype/Tests/ProposalModelRegression.swift \
            -o /tmp/family-proposal-regression
          /tmp/family-proposal-regression

      - name: Test offline queue model semantics
        run: |
          swiftc \
            apps/011-family-life-os/prototype/FamilyLifePrototype/Domain/Models.swift \
            apps/011-family-life-os/prototype/Tests/OfflineQueueModelRegression.swift \
            -o /tmp/family-offline-queue-regression
          /tmp/family-offline-queue-regression

      - name: Test connectivity resume transitions
        run: |
          swiftc \
            apps/011-family-life-os/prototype/FamilyLifePrototype/Domain/Models.swift \
            apps/011-family-life-os/prototype/Tests/ConnectivityResumePolicyRegression.swift \
            -o /tmp/family-connectivity-resume-regression
          /tmp/family-connectivity-resume-regression

      - name: Test Family Pro entitlement policy
        run: |
          swiftc \
            apps/011-family-life-os/prototype/FamilyLifePrototype/Domain/Models.swift \
            apps/011-family-life-os/prototype/Tests/FamilyProPolicyRegression.swift \
            -o /tmp/family-pro-policy-regression
          /tmp/family-pro-policy-regression

      - name: Verify Family Pro and account-deletion release links
        run: |
          grep -F 'https://www.kamilunavo.com/family/privacy' apps/011-family-life-os/prototype/FamilyLifePrototype/Views/SettingsView.swift
          grep -F 'https://www.kamilunavo.com/family/terms' apps/011-family-life-os/prototype/FamilyLifePrototype/Views/SettingsView.swift
          grep -F 'Account und Daten löschen' apps/011-family-life-os/prototype/FamilyLifePrototype/Views/SettingsView.swift
          grep -F 'delete-family-data' apps/011-family-life-os/prototype/FamilyLifePrototype/Views/SettingsView.swift

      - name: Verify AppIcon release asset
        run: |
          set -euo pipefail
          ICON='apps/011-family-life-os/prototype/FamilyLifePrototype/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
          test -f "$ICON"
          test -s "$ICON"
          test "$(sips -g pixelWidth "$ICON" 2>/dev/null | awk '/pixelWidth/ {print $2}')" = '1024'
          test "$(sips -g pixelHeight "$ICON" 2>/dev/null | awk '/pixelHeight/ {print $2}')" = '1024'
          test "$(sips -g hasAlpha "$ICON" 2>/dev/null | awk '/hasAlpha/ {print $2}')" = 'no'
          grep -F '"filename" : "AppIcon-1024.png"' apps/011-family-life-os/prototype/FamilyLifePrototype/Assets.xcassets/AppIcon.appiconset/Contents.json
          swift apps/011-family-life-os/ci/family_app_icon.swift verify "$ICON"

      - name: Build Family Life OS prototype for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/011-family-life-os/prototype/FamilyLifePrototype.xcodeproj \
            -scheme FamilyLifePrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/family-life-os-build.log

      - name: Extract compiler diagnostics
        if: failure()
        run: |
          grep -E '(^|[[:space:]])(error|warning):|\.swift:[0-9]+:[0-9]+: (error|warning):' /tmp/family-life-os-build.log > /tmp/family-life-os-diagnostics.txt || true
          cat /tmp/family-life-os-diagnostics.txt

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: family-life-os-xcode-diagnostics
          path: |
            /tmp/family-life-os-build.log
            /tmp/family-life-os-diagnostics.txt
          if-no-files-found: error
          retention-days: 3

  app-store-final-submit:
    name: Family Life OS App Store final submit
    if: github.event_name == 'pull_request' && github.head_ref == 'release/family-appstore-final-submit'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APP_ID: '6803079524'
      APP_INFO_ID: 8a251f47-904a-4333-b2a8-3a3a06bb4fa2
      VERSION_ID: e7a061e3-bd05-453c-a911-00e1e8cb4f76
      VLOC_ID: 557ca16e-28b4-44d0-83ec-11d8890f0376
      REVIEW_SUBMISSION_ID: 3b4e487e-d776-471e-abff-0fae824a72cd
      BUNDLE_ID: de.kamilunavo.familyprototype
      PROJECT_DIR: apps/011-family-life-os/prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare App Store Connect token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+1200,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s))
          raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Set content rights and primary category
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          APP_BODY=$(jq -n --arg id "$APP_ID" '{data:{type:"apps",id:$id,attributes:{contentRightsDeclaration:"USES_THIRD_PARTY_CONTENT"}}}')
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$APP_BODY" "$BASE/v1/apps/$APP_ID" >/dev/null
          INFO_BODY=$(jq -n --arg id "$APP_INFO_ID" '{data:{type:"appInfos",id:$id,relationships:{primaryCategory:{data:{type:"appCategories",id:"PRODUCTIVITY"}}}}}')
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$INFO_BODY" "$BASE/v1/appInfos/$APP_INFO_ID" >/dev/null
          APP=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/apps/$APP_ID")
          CAT=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/appInfos/$APP_INFO_ID/primaryCategory")
          test "$(jq -r '.data.attributes.contentRightsDeclaration' <<<"$APP")" = 'USES_THIRD_PARTY_CONTENT'
          test "$(jq -r '.data.id' <<<"$CAT")" = 'PRODUCTIVITY'
          echo 'Content rights and primary category verified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Create genuine 12.9-inch iPad screenshot
        run: |
          set -euo pipefail
          DTYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | contains("iPad Pro (12.9-inch)"))] | last | .identifier // empty')
          test -n "$DTYPE"
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable == true and (.name | startswith("iOS")))] | sort_by(.version) | last | .identifier // empty')
          test -n "$RUNTIME"
          UDID=$(xcrun simctl create FamilyLifeAppStoreShot "$DTYPE" "$RUNTIME")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 09:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          rm -rf "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData"
          xcodebuild \
            -project "$PROJECT_DIR/FamilyLifePrototype.xcodeproj" \
            -scheme FamilyLifePrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP=$(find "$RUNNER_TEMP/FamilyLifeScreenshotDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP" -a -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -familyProReviewScreenshot
          sleep 4
          SHOT="$RUNNER_TEMP/Family-Life-OS-iPad-12.9.png"
          xcrun simctl io "$UDID" screenshot "$SHOT"
          test -s "$SHOT"
          W=$(sips -g pixelWidth "$SHOT" 2>/dev/null | awk '/pixelWidth/ {print $2}')
          H=$(sips -g pixelHeight "$SHOT" 2>/dev/null | awk '/pixelHeight/ {print $2}')
          echo "Screenshot dimensions: ${W}x${H}"
          if [[ "$W" != 2048 || "$H" != 2732 ]]; then
            echo "Expected 2048x2732 for 12.9-inch iPad, got ${W}x${H}" >&2
            exit 1
          fi
          echo "IPAD_SCREENSHOT=$SHOT" >> "$GITHUB_ENV"

      - name: Upload required iPad screenshot to App Store Connect
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          api_get(){ curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" -H 'Accept: application/json' "$BASE$1"; }
          api_post(){ curl --fail-with-body -sS -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$2" "$BASE$1"; }
          api_patch(){ curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$2" "$BASE$1"; }

          SETS=$(api_get "/v1/appStoreVersionLocalizations/$VLOC_ID/appScreenshotSets?filter%5BscreenshotDisplayType%5D=APP_IPAD_PRO_3GEN_129&include=appScreenshots&limit=50")
          SET_ID=$(jq -r '.data[0].id // empty' <<<"$SETS")
          if [[ -z "$SET_ID" ]]; then
            BODY=$(jq -n --arg loc "$VLOC_ID" '{data:{type:"appScreenshotSets",attributes:{screenshotDisplayType:"APP_IPAD_PRO_3GEN_129"},relationships:{appStoreVersionLocalization:{data:{type:"appStoreVersionLocalizations",id:$loc}}}}}')
            CREATED=$(api_post '/v1/appScreenshotSets' "$BODY")
            SET_ID=$(jq -r '.data.id // empty' <<<"$CREATED")
          fi
          test -n "$SET_ID"

          CURRENT=$(api_get "/v1/appScreenshotSets/$SET_ID/appScreenshots?limit=50")
          COMPLETE_COUNT=$(jq '[.data[]? | select(.attributes.assetDeliveryState.state=="COMPLETE")] | length' <<<"$CURRENT")
          if [[ "$COMPLETE_COUNT" -eq 0 ]]; then
            SIZE=$(stat -f%z "$IPAD_SCREENSHOT")
            NAME=$(basename "$IPAD_SCREENSHOT")
            BODY=$(jq -n --arg set "$SET_ID" --arg name "$NAME" --argjson size "$SIZE" '{data:{type:"appScreenshots",attributes:{fileName:$name,fileSize:$size},relationships:{appScreenshotSet:{data:{type:"appScreenshotSets",id:$set}}}}}')
            RESERVED=$(api_post '/v1/appScreenshots' "$BODY")
            SCREENSHOT_ID=$(jq -r '.data.id // empty' <<<"$RESERVED")
            test -n "$SCREENSHOT_ID"
            printf '%s' "$RESERVED" > "$RUNNER_TEMP/screenshot-reservation.json"

            python3 - "$RUNNER_TEMP/screenshot-reservation.json" "$IPAD_SCREENSHOT" <<'PY'
          import json, sys, urllib.request
          reservation_path, file_path = sys.argv[1:3]
          with open(reservation_path, 'r', encoding='utf-8') as f:
              reservation = json.load(f)
          ops = reservation['data']['attributes']['uploadOperations']
          with open(file_path, 'rb') as source:
              for op in ops:
                  source.seek(op['offset'])
                  chunk = source.read(op['length'])
                  headers = {h['name']: h['value'] for h in op.get('requestHeaders', [])}
                  req = urllib.request.Request(op['url'], data=chunk, method=op['method'], headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      if not 200 <= resp.status < 300:
                          raise RuntimeError(f'upload failed: {resp.status}')
          PY

            CHECKSUM=$(md5 -q "$IPAD_SCREENSHOT")
            COMMIT=$(jq -n --arg id "$SCREENSHOT_ID" --arg sum "$CHECKSUM" '{data:{type:"appScreenshots",id:$id,attributes:{uploaded:true,sourceFileChecksum:$sum}}}')
            api_patch "/v1/appScreenshots/$SCREENSHOT_ID" "$COMMIT" >/dev/null

            STATE=''
            for i in {1..30}; do
              sleep 4
              SHOT=$(api_get "/v1/appScreenshots/$SCREENSHOT_ID")
              STATE=$(jq -r '.data.attributes.assetDeliveryState.state // empty' <<<"$SHOT")
              echo "Screenshot processing: $STATE"
              [[ "$STATE" == COMPLETE ]] && break
              if [[ "$STATE" == FAILED ]]; then
                jq '.data.attributes.assetDeliveryState' <<<"$SHOT" >&2
                exit 1
              fi
            done
            test "$STATE" = COMPLETE
          fi
          echo 'Required 12.9-inch iPad screenshot is COMPLETE.' >> "$GITHUB_STEP_SUMMARY"

      - name: Add app version and submit Family Life OS with Family Pro
        run: |
          set -euo pipefail
          BASE='https://api.appstoreconnect.apple.com'
          SID="$REVIEW_SUBMISSION_ID"
          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?include=appStoreVersion,subscriptionVersion,subscriptionGroupVersion&limit=50")
          HAS_APP=$(jq -r --arg vid "$VERSION_ID" '[.included[]? | select(.type=="appStoreVersions" and .id==$vid)] | length' <<<"$ITEMS")
          if [[ "$HAS_APP" -eq 0 ]]; then
            BODY=$(jq -n --arg sid "$SID" --arg vid "$VERSION_ID" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$sid}},appStoreVersion:{data:{type:"appStoreVersions",id:$vid}}}}}')
            OUT="$RUNNER_TEMP/app-review-item.json"
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissionItems")
            if [[ "$CODE" != 201 && "$CODE" != 409 ]]; then cat "$OUT" >&2; exit 1; fi
            if [[ "$CODE" == 409 ]]; then cat "$OUT" >&2; exit 1; fi
          fi

          ITEMS=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID/items?include=appStoreVersion,subscriptionVersion,subscriptionGroupVersion&limit=50")
          COUNT=$(jq '.data | length' <<<"$ITEMS")
          echo "Review package contains $COUNT item(s)."
          jq -r '.included[]? | "included: \(.type) \(.id) state=\(.attributes.state // "n/a")"' <<<"$ITEMS" || true
          test "$COUNT" -ge 4

          BODY=$(jq -n --arg id "$SID" '{data:{type:"reviewSubmissions",id:$id,attributes:{submitted:true}}}')
          OUT="$RUNNER_TEMP/submit.json"
          CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$BASE/v1/reviewSubmissions/$SID")
          if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then cat "$OUT" >&2; exit 1; fi

          STATE=''
          for i in {1..20}; do
            sleep 4
            R=$(curl --fail-with-body -sS -H "Authorization: Bearer $ASC_TOKEN" "$BASE/v1/reviewSubmissions/$SID")
            STATE=$(jq -r '.data.attributes.state // empty' <<<"$R")
            echo "Review submission state: $STATE"
            case "$STATE" in WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE) break ;; esac
          done
          case "$STATE" in
            WAITING_FOR_REVIEW|IN_REVIEW|COMPLETE)
              echo "✅ Family Life OS 1.0 + Family Pro submitted to Apple: $STATE" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Submission did not reach review state: $STATE" >&2
              exit 1
              ;;
          esac

      - name: Upload generated App Store screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-life-os-ipad-app-store-screenshot
          path: ${{ env.IPAD_SCREENSHOT }}
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          [[ -z "${SIM_UDID:-}" ]] || xcrun simctl delete "$SIM_UDID" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/screenshot-reservation.json "$RUNNER_TEMP"/app-review-item.json "$RUNNER_TEMP"/submit.json
