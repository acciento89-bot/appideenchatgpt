name: Evidaro Prototype Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/002-evidaro/**'
      - '.github/workflows/evidaro-prototype-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/002-evidaro/**'

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run Evidaro foundation preflight
        run: python3 apps/002-evidaro/ci/preflight.py

      - name: Build Evidaro prototype for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/002-evidaro/prototype/EvidaroPrototype.xcodeproj \
            -scheme EvidaroPrototype \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/evidaro-build.log

      - name: Verify persistence, integrity, OCR, PDF pack and privacy lock across process relaunch
        run: |
          set -euo pipefail

          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for devices in data.get("devices", {}).values():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')"

          echo "Using simulator: ${DEVICE_UDID}"
          xcrun simctl boot "${DEVICE_UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${DEVICE_UDID}" -b

          rm -rf /tmp/evidaro-smoke-derived
          xcodebuild \
            -project apps/002-evidaro/prototype/EvidaroPrototype.xcodeproj \
            -scheme EvidaroPrototype \
            -configuration Debug \
            -destination "id=${DEVICE_UDID}" \
            -derivedDataPath /tmp/evidaro-smoke-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="/tmp/evidaro-smoke-derived/Build/Products/Debug-iphonesimulator/EvidaroPrototype.app"
          BUNDLE_ID="de.kamilunavo.evidaro.prototype"
          xcrun simctl uninstall "${DEVICE_UDID}" "${BUNDLE_ID}" 2>/dev/null || true
          xcrun simctl install "${DEVICE_UDID}" "${APP_PATH}"

          DATA_CONTAINER="$(xcrun simctl get_app_container "${DEVICE_UDID}" "${BUNDLE_ID}" data)"
          SMOKE_DIR="${DATA_CONTAINER}/Library/Application Support/EvidaroSmoke"

          rm -f "${SMOKE_DIR}/failed.txt" "${SMOKE_DIR}/prepared.txt" "${SMOKE_DIR}/verified.txt"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-persistence-smoke prepare
          for _ in $(seq 1 20); do
            test -f "${SMOKE_DIR}/prepared.txt" && break
            test -f "${SMOKE_DIR}/failed.txt" && { cat "${SMOKE_DIR}/failed.txt"; exit 1; }
            sleep 1
          done
          test -f "${SMOKE_DIR}/prepared.txt"
          cat "${SMOKE_DIR}/prepared.txt"

          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-persistence-smoke verify
          for _ in $(seq 1 20); do
            test -f "${SMOKE_DIR}/verified.txt" && break
            test -f "${SMOKE_DIR}/failed.txt" && { cat "${SMOKE_DIR}/failed.txt"; exit 1; }
            sleep 1
          done
          test -f "${SMOKE_DIR}/verified.txt"
          grep -q '^verified case=' "${SMOKE_DIR}/verified.txt"
          cat "${SMOKE_DIR}/verified.txt"
          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}" || true

          rm -f "${SMOKE_DIR}/failed.txt" "${SMOKE_DIR}/ocr-prepared.txt" "${SMOKE_DIR}/ocr-verified.txt"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-persistence-smoke ocr-prepare
          for _ in $(seq 1 30); do
            test -f "${SMOKE_DIR}/ocr-prepared.txt" && break
            test -f "${SMOKE_DIR}/failed.txt" && { cat "${SMOKE_DIR}/failed.txt"; exit 1; }
            sleep 1
          done
          test -f "${SMOKE_DIR}/ocr-prepared.txt"
          grep -q '^ocr-prepared text=' "${SMOKE_DIR}/ocr-prepared.txt"
          grep -qi 'EVIDARO' "${SMOKE_DIR}/ocr-prepared.txt"
          grep -q '4827' "${SMOKE_DIR}/ocr-prepared.txt"
          cat "${SMOKE_DIR}/ocr-prepared.txt"

          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-persistence-smoke ocr-verify
          for _ in $(seq 1 20); do
            test -f "${SMOKE_DIR}/ocr-verified.txt" && break
            test -f "${SMOKE_DIR}/failed.txt" && { cat "${SMOKE_DIR}/failed.txt"; exit 1; }
            sleep 1
          done
          test -f "${SMOKE_DIR}/ocr-verified.txt"
          grep -q '^ocr-verified text=' "${SMOKE_DIR}/ocr-verified.txt"
          grep -qi 'EVIDARO' "${SMOKE_DIR}/ocr-verified.txt"
          grep -q '4827' "${SMOKE_DIR}/ocr-verified.txt"
          cat "${SMOKE_DIR}/ocr-verified.txt"
          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}" || true

          rm -f "${SMOKE_DIR}/failed.txt" "${SMOKE_DIR}/pack-prepared.txt" "${SMOKE_DIR}/pack-verified.txt"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-persistence-smoke pack-prepare
          for _ in $(seq 1 30); do
            test -f "${SMOKE_DIR}/pack-prepared.txt" && break
            test -f "${SMOKE_DIR}/failed.txt" && { cat "${SMOKE_DIR}/failed.txt"; exit 1; }
            sleep 1
          done
          test -f "${SMOKE_DIR}/pack-prepared.txt"
          grep -q '^pack-prepared pages=' "${SMOKE_DIR}/pack-prepared.txt"
          grep -q 'pdfHash=' "${SMOKE_DIR}/pack-prepared.txt"
          PACK_PREPARED_HASH="$(sed -E 's/.*pdfHash=([0-9a-f]{64}).*/\1/' "${SMOKE_DIR}/pack-prepared.txt")"
          test "${#PACK_PREPARED_HASH}" -eq 64
          cat "${SMOKE_DIR}/pack-prepared.txt"

          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-persistence-smoke pack-verify
          for _ in $(seq 1 20); do
            test -f "${SMOKE_DIR}/pack-verified.txt" && break
            test -f "${SMOKE_DIR}/failed.txt" && { cat "${SMOKE_DIR}/failed.txt"; exit 1; }
            sleep 1
          done
          test -f "${SMOKE_DIR}/pack-verified.txt"
          grep -q '^pack-verified pages=' "${SMOKE_DIR}/pack-verified.txt"
          PACK_VERIFIED_HASH="$(sed -E 's/.*pdfHash=([0-9a-f]{64}).*/\1/' "${SMOKE_DIR}/pack-verified.txt")"
          test "${PACK_VERIFIED_HASH}" = "${PACK_PREPARED_HASH}"
          cat "${SMOKE_DIR}/pack-verified.txt"
          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}" || true

          rm -f "${SMOKE_DIR}/lock-failed.txt" "${SMOKE_DIR}/lock-prepared.txt" "${SMOKE_DIR}/lock-verified.txt"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-app-lock-smoke prepare
          for _ in $(seq 1 20); do
            test -f "${SMOKE_DIR}/lock-prepared.txt" && break
            test -f "${SMOKE_DIR}/lock-failed.txt" && { cat "${SMOKE_DIR}/lock-failed.txt"; exit 1; }
            sleep 1
          done
          test -f "${SMOKE_DIR}/lock-prepared.txt"
          grep -q '^lock-prepared enabled=true locked=true preference=true$' "${SMOKE_DIR}/lock-prepared.txt"
          cat "${SMOKE_DIR}/lock-prepared.txt"

          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-app-lock-smoke verify
          for _ in $(seq 1 20); do
            test -f "${SMOKE_DIR}/lock-verified.txt" && break
            test -f "${SMOKE_DIR}/lock-failed.txt" && { cat "${SMOKE_DIR}/lock-failed.txt"; exit 1; }
            sleep 1
          done
          test -f "${SMOKE_DIR}/lock-verified.txt"
          grep -q '^lock-verified persisted=true unlocked=true disabled=true$' "${SMOKE_DIR}/lock-verified.txt"
          cat "${SMOKE_DIR}/lock-verified.txt"
          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}" || true

      - name: Extract compiler diagnostics
        if: failure()
        run: |
          grep -E '(^|[[:space:]])(error|warning):|\.swift:[0-9]+:[0-9]+: (error|warning):' /tmp/evidaro-build.log > /tmp/evidaro-diagnostics.txt || true
          cat /tmp/evidaro-diagnostics.txt

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidaro-xcode-diagnostics
          path: |
            /tmp/evidaro-build.log
            /tmp/evidaro-diagnostics.txt
          if-no-files-found: warn
          retention-days: 3
