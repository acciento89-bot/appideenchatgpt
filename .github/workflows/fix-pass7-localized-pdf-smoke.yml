name: Fix Pass 7 localized PDF smoke

on:
  push:
    branches:
      - agent/002-evidaro-localization-accessibility
    paths:
      - '.github/workflows/fix-pass7-localized-pdf-smoke.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pass 7 branch
        uses: actions/checkout@v5
        with:
          ref: agent/002-evidaro-localization-accessibility
          fetch-depth: 0

      - name: Make PDF smoke assertions locale-aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/002-evidaro/prototype/EvidaroPrototype/EvidaroPrototypeApp.swift')
          text = path.read_text()
          old = '''        let text = document.string ?? ""
        let requiredTokens = [
            "EVIDARO",
            "EVIDENCE PACK",
            "CI OCR Smoke",
            evidencePackSmokeCaseID.uuidString,
            "Original media SHA-256",
            mediaHash,
            "Evidence record SHA-256",
            recordHash,
            "DERIVED OCR",
            "EVIDARO 4827",
            "SNAPSHOT SEALS",
            sealHash,
            "Integrity aid only"
        ]
'''
          new = '''        let text = document.string ?? ""
        let legalText = L10n.string("pdf.integrity.legal")
        let legalMarker = legalText.components(separatedBy: ".").first ?? legalText
        let requiredTokens = [
            "EVIDARO",
            L10n.string("pdf.heading.evidence_pack"),
            "CI OCR Smoke",
            evidencePackSmokeCaseID.uuidString,
            L10n.string("pdf.field.original_sha"),
            mediaHash,
            L10n.string("pdf.field.record_sha"),
            recordHash,
            L10n.string("pdf.ocr.heading"),
            "EVIDARO 4827",
            L10n.string("pdf.seals.heading"),
            sealHash,
            legalMarker
        ]
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy PDF smoke token block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-pass7-localized-pdf-smoke.yml
          git add apps/002-evidaro/prototype/EvidaroPrototype/EvidaroPrototypeApp.swift
          git commit -m 'Fix localized PDF smoke assertions'
          git push origin HEAD:agent/002-evidaro-localization-accessibility
