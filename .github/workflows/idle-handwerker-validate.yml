name: Idle Handwerker Validate

on:
  push:
    branches:
      - main
      - 'codex/idle-handwerker-*'
    paths:
      - 'apps/005-idle-handwerker/**'
      - '.github/workflows/idle-handwerker-validate.yml'
  pull_request:
    paths:
      - 'apps/005-idle-handwerker/**'
      - '.github/workflows/idle-handwerker-validate.yml'

permissions:
  contents: read

env:
  GODOT_TAG: 4.7.1-stable
  PROJECT_DIR: apps/005-idle-handwerker

jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned AdMob plugin
        shell: bash
        run: |
          set -euo pipefail
          ADMOB_VERSION='v5.0.0'
          ADMOB_ARCHIVE="poing-godot-admob-$ADMOB_VERSION.zip"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/$ADMOB_ARCHIVE" \
            "https://github.com/poingstudios/godot-admob-plugin/releases/download/$ADMOB_VERSION/$ADMOB_ARCHIVE"
          unzip -q "$RUNNER_TEMP/$ADMOB_ARCHIVE" -d "$RUNNER_TEMP/godot-admob"
          ADMOB_SOURCE="$RUNNER_TEMP/godot-admob/poing-godot-admob/addons/admob"
          test -f "$ADMOB_SOURCE/plugin.cfg"
          rm -rf "$PROJECT_DIR/addons/admob"
          mkdir -p "$PROJECT_DIR/addons"
          cp -R "$ADMOB_SOURCE" "$PROJECT_DIR/addons/admob"

      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Compile project
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --editor --path "$PROJECT_DIR" --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Failed loading resource" godot-import.log; then
            exit 1
          fi

      - name: Validate iOS release metadata
        shell: bash
        run: |
          set -euo pipefail
          PRESET="$PROJECT_DIR/export_presets.cfg"
          PROJECT="$PROJECT_DIR/project.godot"
          ICON="$PROJECT_DIR/assets/branding/app_icon.svg"
          test -f "$PRESET"
          test -f "$ICON"
          grep -Fx 'platform="iOS"' "$PRESET"
          grep -Fx 'application/app_store_team_id="TKG684N5GL"' "$PRESET"
          grep -Fx 'application/bundle_identifier="de.kamilunavo.idlehandwerker"' "$PRESET"
          grep -Fx 'application/short_version="1.0.0"' "$PRESET"
          grep -Fx 'application/export_project_only=true' "$PRESET"
          grep -Fx 'privacy/tracking_enabled=false' "$PRESET"
          grep -Fx 'config/version="1.0.0"' "$PROJECT"
          grep -Fx 'config/icon="res://assets/branding/app_icon.svg"' "$PROJECT"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          icon = Path('apps/005-idle-handwerker/assets/branding/app_icon.svg')
          root = ET.parse(icon).getroot()
          assert root.attrib['width'] == '1024'
          assert root.attrib['height'] == '1024'
          assert root.attrib['viewBox'] == '0 0 1024 1024'
          PY

      - name: Run economy tests
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/test_economy.gd 2>&1 | tee godot-tests.log
          grep -q "All economy tests passed." godot-tests.log

      - name: Run responsive UI smoke tests
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/test_ui_smoke.gd 2>&1 | tee godot-ui-tests.log
          grep -q "All responsive UI smoke tests passed." godot-ui-tests.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: idle-handwerker-validation-logs
          path: |
            godot-import.log
            godot-tests.log
            godot-ui-tests.log
          if-no-files-found: ignore
