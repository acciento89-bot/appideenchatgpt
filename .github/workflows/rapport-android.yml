name: Rapport AI Android
on:
  workflow_dispatch:
    inputs:
      native:
        description: Run the single owned native acceptance device instead of the unsigned build
        type: boolean
        default: false
  pull_request:
    paths: ['apps/012-rapport-ai/android/**', '.github/rapport-native/**', '.github/workflows/rapport-android.yml']
  push:
    branches: [main]
    paths: ['apps/012-rapport-ai/android/**', '.github/rapport-native/**', '.github/workflows/rapport-android.yml']
permissions: {contents: read}
concurrency:
  group: rapport-android-${{ github.ref }}-${{ inputs.native || false }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Controller privacy and exact-device cleanup checks
        run: python3 -m unittest discover -s .github/rapport-native/tests -v
      - name: Actual runtime graph, domain tests, lint and release bundle
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          bash apps/012-rapport-ai/android/ci/test_release_contract.sh
          gradle -p apps/012-rapport-ai/android --no-daemon --max-workers=1 verifyFragmentRuntime testDebugUnitTest lintDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: RapportAI-1.3.0-5-unsigned-release-aab
          path: apps/012-rapport-ai/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Record exact source and validate controller
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rapport-native-acceptance/rapport"
          git rev-parse HEAD > "$RUNNER_TEMP/rapport-native-acceptance/rapport/source-commit.txt"
          python3 -m unittest discover -s .github/rapport-native/tests -v
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build real candidate and native tests
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle -p apps/012-rapport-ai/android --no-daemon --max-workers=1 verifyFragmentRuntime testDebugUnitTest assembleDebug assembleDebugAndroidTest > "$RUNNER_TEMP/rapport-native-acceptance/rapport/build.log" 2>&1
      - name: Enable official KVM
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Actual free-user native UI and process cold reopen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: RapportNativeAcceptance-35
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: bash .github/rapport-native/run-cloud.sh
      - name: Encrypt bounded actual evidence
        if: always()
        run: python3 .github/rapport-native/encrypt_evidence.py "$RUNNER_TEMP/rapport-native-acceptance/rapport" "$RUNNER_TEMP/rapport-native-encrypted/rapport/acceptance.cms"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rapport-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rapport-native-encrypted/rapport/acceptance.cms
          if-no-files-found: warn
          retention-days: 7
