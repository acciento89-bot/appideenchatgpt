name: Kamilunavo Trace Static Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/002-evidaro/**'
      - '.github/workflows/kamilunavo-trace-static-release.yml'
      - '.github/workflows/kamilunavo-trace-testflight.yml'

permissions:
  contents: write

jobs:
  repair-icon-binary:
    if: github.head_ref == 'fix/002-trace-appicon-binary-build9'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/002-trace-appicon-binary-build9
          fetch-depth: 0
      - name: Reconstruct and push exact valid Trace AppIcon
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='apps/002-evidaro/ci/icon_payload'
          ICON='apps/002-evidaro/prototype/EvidaroPrototype/Assets.xcassets/AppIcon.appiconset/KamilunavoTrace-AppIcon-1024.png'
          cat "$PAYLOAD"/*.txt | tr -d '\n\r' | base64 --decode > "$ICON"
          test "$(sha256sum "$ICON" | awk '{print $1}')" = 'd13e4198d6583a7a7cf1f41217d67285075581f53952100d21ad720edcb60dfe'
          python3 apps/002-evidaro/ci/icon_no_alpha.py
          rm -rf "$PAYLOAD"
          git config user.name 'Kamilunavo CI'
          git config user.email 'acciento89@gmail.com'
          git add "$ICON" apps/002-evidaro/ci/icon_payload
          git commit -m 'Install verified Trace AppIcon binary'
          git push origin HEAD:fix/002-trace-appicon-binary-build9
