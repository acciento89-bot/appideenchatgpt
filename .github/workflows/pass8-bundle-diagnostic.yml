name: Pass 8 Bundle Diagnostic

on:
  push:
    branches:
      - agent/002-evidaro-offline-verifier
    paths:
      - '.github/workflows/pass8-bundle-diagnostic.yml'

jobs:
  bundle-diagnostic:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build diagnostic app
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for devices in data.get("devices", {}).values():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')"
          echo "DEVICE_UDID=${DEVICE_UDID}" >> "$GITHUB_ENV"
          xcrun simctl boot "${DEVICE_UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${DEVICE_UDID}" -b
          rm -rf /tmp/evidaro-pass8-diag-derived
          xcodebuild \
            -project apps/002-evidaro/prototype/EvidaroPrototype.xcodeproj \
            -scheme EvidaroPrototype \
            -configuration Debug \
            -destination "id=${DEVICE_UDID}" \
            -derivedDataPath /tmp/evidaro-pass8-diag-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="/tmp/evidaro-pass8-diag-derived/Build/Products/Debug-iphonesimulator/EvidaroPrototype.app"
          BUNDLE_ID="de.kamilunavo.evidaro.prototype"
          xcrun simctl uninstall "${DEVICE_UDID}" "${BUNDLE_ID}" 2>/dev/null || true
          xcrun simctl install "${DEVICE_UDID}" "${APP_PATH}"
          DATA_CONTAINER="$(xcrun simctl get_app_container "${DEVICE_UDID}" "${BUNDLE_ID}" data)"
          echo "BUNDLE_ID=${BUNDLE_ID}" >> "$GITHUB_ENV"
          echo "SMOKE_DIR=${DATA_CONTAINER}/Library/Application Support/EvidaroSmoke" >> "$GITHUB_ENV"

      - name: Prepare OCR fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass8-diag
          echo 'stage=ocr-prepare' > /tmp/pass8-diag/stage.txt
          rm -f "${SMOKE_DIR}/failed.txt" "${SMOKE_DIR}/ocr-prepared.txt" "${SMOKE_DIR}/ocr-verified.txt"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-persistence-smoke ocr-prepare
          for _ in $(seq 1 40); do
            if test -f "${SMOKE_DIR}/ocr-prepared.txt"; then
              cat "${SMOKE_DIR}/ocr-prepared.txt"
              exit 0
            fi
            if test -f "${SMOKE_DIR}/failed.txt"; then
              cat "${SMOKE_DIR}/failed.txt"
              cp "${SMOKE_DIR}/failed.txt" /tmp/pass8-diag/ocr-failed.txt
              exit 1
            fi
            sleep 1
          done
          echo 'OCR prepare timed out' | tee /tmp/pass8-diag/ocr-failed.txt
          exit 1

      - name: Prepare and tamper-check bundle
        shell: bash
        run: |
          set -euo pipefail
          echo 'stage=bundle-prepare' > /tmp/pass8-diag/stage.txt
          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}" || true
          rm -f "${SMOKE_DIR}/bundle-failed.txt" "${SMOKE_DIR}/bundle-prepared.txt" "${SMOKE_DIR}/bundle-verified.txt"
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-verification-bundle-smoke prepare
          for _ in $(seq 1 40); do
            if test -f "${SMOKE_DIR}/bundle-prepared.txt"; then
              cat "${SMOKE_DIR}/bundle-prepared.txt"
              cp "${SMOKE_DIR}/bundle-prepared.txt" /tmp/pass8-diag/
              exit 0
            fi
            if test -f "${SMOKE_DIR}/bundle-failed.txt"; then
              cat "${SMOKE_DIR}/bundle-failed.txt"
              cp "${SMOKE_DIR}/bundle-failed.txt" /tmp/pass8-diag/
              exit 1
            fi
            sleep 1
          done
          echo 'Bundle prepare timed out' | tee /tmp/pass8-diag/bundle-timeout.txt
          exit 1

      - name: Verify bundle after process relaunch
        shell: bash
        run: |
          set -euo pipefail
          echo 'stage=bundle-verify' > /tmp/pass8-diag/stage.txt
          xcrun simctl terminate "${DEVICE_UDID}" "${BUNDLE_ID}" || true
          xcrun simctl launch "${DEVICE_UDID}" "${BUNDLE_ID}" --evidaro-verification-bundle-smoke verify
          for _ in $(seq 1 40); do
            if test -f "${SMOKE_DIR}/bundle-verified.txt"; then
              cat "${SMOKE_DIR}/bundle-verified.txt"
              cp "${SMOKE_DIR}/bundle-verified.txt" /tmp/pass8-diag/
              exit 0
            fi
            if test -f "${SMOKE_DIR}/bundle-failed.txt"; then
              cat "${SMOKE_DIR}/bundle-failed.txt"
              cp "${SMOKE_DIR}/bundle-failed.txt" /tmp/pass8-diag/
              exit 1
            fi
            sleep 1
          done
          echo 'Bundle verify timed out' | tee /tmp/pass8-diag/bundle-verify-timeout.txt
          exit 1

      - name: Snapshot smoke diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/pass8-diag/smoke
          if test -d "${SMOKE_DIR}"; then
            cp -R "${SMOKE_DIR}/." /tmp/pass8-diag/smoke/ || true
          fi
          find /tmp/pass8-diag -maxdepth 2 -type f -print -exec sh -c 'echo "--- $1"; cat "$1" 2>/dev/null || true' _ {} \;

      - name: Upload Pass 8 runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass8-bundle-runtime-diagnostics
          path: /tmp/pass8-diag
          if-no-files-found: error
          retention-days: 3
