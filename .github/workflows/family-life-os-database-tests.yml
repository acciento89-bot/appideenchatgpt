name: Family Life OS Database Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/011-family-life-os/supabase/**'
      - '.github/workflows/family-life-os-database-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/011-family-life-os/supabase/**'
      - '.github/workflows/family-life-os-database-tests.yml'

concurrency:
  group: family-life-os-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/011-family-life-os

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Show Supabase version
        run: supabase --version

      - name: Start fresh local Postgres and apply migrations
        run: supabase db start

      - name: Run pgTAP database and RLS tests
        run: supabase test db
