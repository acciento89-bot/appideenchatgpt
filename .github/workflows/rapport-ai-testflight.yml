name: Rapport AI TestFlight

on:
  workflow_dispatch:
    inputs:
      build:
        description: App Store Connect build number
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/rapport-ai-testflight.yml"
      - "apps/012-rapport-ai/prototype/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: rapport-ai-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  TEAM_ID: TKG684N5GL
  BUNDLE_ID: de.kamilunavo.rapportai
  PROJECT_DIR: apps/012-rapport-ai/prototype
  XCODE_PROJECT: RapportAI.xcodeproj
  SCHEME: RapportAI

jobs:
  device-and-testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select build number
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          PROJECT_FILE="$PROJECT_DIR/$XCODE_PROJECT/project.pbxproj"
          PROJECT_BUILD=$(awk -F'= ' '/CURRENT_PROJECT_VERSION = [0-9]+;/{gsub(/;/,"",$2); print $2; exit}' "$PROJECT_FILE")
          BUILD="${REQUESTED_BUILD:-$PROJECT_BUILD}"
          [[ "$BUILD" =~ ^[0-9]+$ ]]
          echo "EFFECTIVE_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "Rapport AI build: 0.1.0 ($BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build unsigned iPhone device app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/RapportAIDerivedData"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RapportAIDerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$EFFECTIVE_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP=$(find "$RUNNER_TEMP/RapportAIDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP" -a -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -qx 'Rapport AI'
          echo "DEVICE_APP=$APP" >> "$GITHUB_ENV"

      - name: Package device validation build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rapport-ai
          ditto -c -k --sequesterRsrc --keepParent "$DEVICE_APP" build/rapport-ai/RapportAI-Unsigned-iOS.app.zip

      - name: Upload device validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapport-ai-device-build
          path: build/rapport-ai/RapportAI-Unsigned-iOS.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Detect App Store Connect secrets
        id: asc
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "$ASC_ISSUER_ID" && -n "$ASC_KEY_ID" && -n "$ASC_PRIVATE_KEY_B64" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Explain PR validation mode
        if: github.event_name == 'pull_request'
        run: echo 'PR validation only; TestFlight upload requires a manual workflow run.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare App Store Connect API key
        if: github.event_name == 'workflow_dispatch' && steps.asc.outputs.available == 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create unsigned release archive
        if: github.event_name == 'workflow_dispatch' && steps.asc.outputs.available == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/RapportAI.xcarchive"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RapportAI.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$EFFECTIVE_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          test -f "$RUNNER_TEMP/RapportAI.xcarchive/Info.plist"
          test -d "$RUNNER_TEMP/RapportAI.xcarchive/Products/Applications/RapportAI.app"

      - name: Create TestFlight export options
        if: github.event_name == 'workflow_dispatch' && steps.asc.outputs.available == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && steps.asc.outputs.available == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/RapportAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/RapportAITestFlightExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Explain missing signing configuration
        if: github.event_name == 'workflow_dispatch' && steps.asc.outputs.available != 'true'
        run: |
          echo 'TestFlight upload skipped: ASC_ISSUER_ID, ASC_KEY_ID and ASC_PRIVATE_KEY_B64 are missing.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
