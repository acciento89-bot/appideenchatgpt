name: Idle Handwerker Android Play

on:
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: Run hosted Android screenshot capture separately from the artifact-only release route
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/005-idle-handwerker/**'
      - '!apps/005-idle-handwerker/play-store/android-screenshots/**'
      - '.github/workflows/idle-handwerker-android.yml'
  pull_request:
    paths:
      - 'apps/005-idle-handwerker/**'
      - '!apps/005-idle-handwerker/play-store/android-screenshots/**'
      - '.github/workflows/idle-handwerker-android.yml'

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  GODOT_TAG: "4.7.1-stable"
  PROJECT_DIR: apps/005-idle-handwerker
  BUNDLETOOL_VERSION: "1.18.2"
  BUNDLETOOL_SHA256: 378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584

  RELEASE_WORKFLOW: .github/workflows/idle-handwerker-android.yml
  PACKAGE_NAME: de.kamilunavo.idlehandwerker
  EXPECTED_VERSION_CODE: '6'
  EXPECTED_VERSION_NAME: 1.5.0
  CENTRAL_SHA1: BCF2337D41E617C03BCAE698C09D1523654BD790
  CENTRAL_SHA256: 7985BD6B33711BACA7E6BA722C2B3870EBBC802F7DB4A7BC1206BDAE51C4D5D6
  GODOT_LINUX_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
  GODOT_TEMPLATES_SHA256: 86409db6200b6f8fd3230989c2d2002851f3dd18acf11d7bdbafddf5a0dd0f72
  CAPTURE_SCREENSHOTS: ${{ github.event_name != 'workflow_dispatch' || inputs.capture_screenshots }}
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release and screenshot contract
        run: |
          ruby .github/scripts/check_workflow_yaml.rb
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash "$PROJECT_DIR/ci/test_android_release_contract.sh"
          python3 .github/scripts/test_godot_release_payload.py -v

  build-and-screenshot:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      screenshot_outcome: ${{ steps.screenshots.outcome }}
      artifact_id: ${{ steps.unsigned.outputs.artifact-id }}
      artifact_digest: ${{ steps.unsigned.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable KVM
        if: github.event_name != 'workflow_dispatch' || inputs.capture_screenshots
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Install pinned Godot IAP plugin
        run: |
          set -euo pipefail
          IAP_COMMIT='4c3a15ddabeeb4d9d43f3879c6d5bbf7cd85624b'
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot-iap.zip" \
            "https://github.com/hyochan/godot-iap/archive/$IAP_COMMIT.zip"
          printf '%s  %s\n' ef78980b0b9be00c156dd2e9d093d4e9cb59f4570813f4ac5f38ac8d762490dd "$RUNNER_TEMP/godot-iap.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot-iap.zip" -d "$RUNNER_TEMP/godot-iap"
          IAP_SOURCE="$RUNNER_TEMP/godot-iap/godot-iap-$IAP_COMMIT/addons/godot-iap"
          test -s "$IAP_SOURCE/android/GodotIap.release.aar"
          rm -rf "$PROJECT_DIR/addons/godot-iap"
          mkdir -p "$PROJECT_DIR/addons"
          cp -R "$IAP_SOURCE" "$PROJECT_DIR/addons/godot-iap"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned AdMob plugin
        run: |
          set -euo pipefail
          ADMOB_VERSION='v5.0.0'
          ADMOB_ARCHIVE="poing-godot-admob-$ADMOB_VERSION.zip"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/$ADMOB_ARCHIVE" \
            "https://github.com/poingstudios/godot-admob-plugin/releases/download/$ADMOB_VERSION/$ADMOB_ARCHIVE"
          printf '%s  %s\n' 93e9aaa8422b00f783c6b8c06a9e2ae3a81db071515517bb061bbb2d202d5fdf "$RUNNER_TEMP/$ADMOB_ARCHIVE" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$ADMOB_ARCHIVE" -d "$RUNNER_TEMP/godot-admob"
          ADMOB_SOURCE="$RUNNER_TEMP/godot-admob/poing-godot-admob/addons/admob"
          test -f "$ADMOB_SOURCE/plugin.cfg"
          rm -rf "$PROJECT_DIR/addons/admob"
          mkdir -p "$PROJECT_DIR/addons"
          cp -R "$ADMOB_SOURCE" "$PROJECT_DIR/addons/admob"
          python3 "$PROJECT_DIR/ci/patch_admob_callbacks.py" "$PROJECT_DIR/addons/admob"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/admob-android-template.zip" \
            "https://github.com/poingstudios/godot-admob-plugin/releases/download/v5.0.0/android-template-v${GODOT_VERSION}.zip"
          printf '%s  %s\n' 0d504a40b92db1abfdf839724c3a962a56569def93dbc608c9537fa38710e65a "$RUNNER_TEMP/admob-android-template.zip" | sha256sum --check --strict
          mkdir -p "$PROJECT_DIR/addons/admob/android/bin"
          unzip -q "$RUNNER_TEMP/admob-android-template.zip" -d "$PROJECT_DIR/addons/admob/android/bin"
          test -s "$PROJECT_DIR/addons/admob/android/bin/ads/libs/poing-godot-admob-ads-release.aar"

      - name: Install Godot Android toolchain
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          printf '%s  %s\n' "$GODOT_LINUX_SHA256" "$RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" "$PROJECT_DIR/android/build" "$PROJECT_DIR/builds/android"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          printf '%s  %s\n' "$GODOT_TEMPLATES_SHA256" "$RUNNER_TEMP/templates.tpz" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$T/"
          unzip -q "$T/android_source.zip" -d "$PROJECT_DIR/android/build"
          touch "$PROJECT_DIR/android/build/.gdignore"
          python3 "$PROJECT_DIR/ci/patch_android_font_scale.py" "$PROJECT_DIR/android/build/src/main/AndroidManifest.xml"
          python3 "$PROJECT_DIR/ci/sanitize_godot_launcher_aar.py" \
            "$PROJECT_DIR/android/build/libs/debug" \
            "$PROJECT_DIR/android/build/libs/release"
          printf '%s\n' "${GODOT_VERSION}.stable" > "$PROJECT_DIR/android/.build_version"
          chmod +x "$PROJECT_DIR/android/build/gradlew"
          cp "$PROJECT_DIR/ci/strip_adaptive_launcher_icons.gradle" "$PROJECT_DIR/android/build/strip_adaptive_launcher_icons.gradle"
          printf '\napply from: "strip_adaptive_launcher_icons.gradle"\n' >> "$PROJECT_DIR/android/build/build.gradle"
          grep -Fq 'apply from: "strip_adaptive_launcher_icons.gradle"' "$PROJECT_DIR/android/build/build.gradle"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum --check -

      - name: Export unsigned AAB and screenshot APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          preset = Path("apps/005-idle-handwerker/export_presets.cfg")
          text = preset.read_text()
          text = text.replace("package/signed=true", "package/signed=false", 1)
          preset.write_text(text)
          PY
          AAB="$GITHUB_WORKSPACE/$PROJECT_DIR/builds/android/idle-handwerker-unsigned.aab"
          APK="$GITHUB_WORKSPACE/$PROJECT_DIR/builds/android/idle-handwerker-screenshots.apk"
          "$GODOT" --headless --editor --path "$PROJECT_DIR" --quit
          "$GODOT" --headless --path "$PROJECT_DIR" --export-release "Android Play" "$AAB"
          test -s "$AAB"
          if [ "$CAPTURE_SCREENSHOTS" = true ]; then
            sed -i '0,/package\/signed=false/s//package\/signed=true/' "$PROJECT_DIR/export_presets.cfg"
            "$GODOT" --headless --path "$PROJECT_DIR" --export-debug "Android Screenshots" "$APK"
            test -s "$APK"
          fi

      - name: Validate AAB identity and metadata
        run: |
          set -euo pipefail
          AAB="$PROJECT_DIR/builds/android/idle-handwerker-unsigned.aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/manifest.xml"
          expected_manifest='package=de.kamilunavo.idlehandwerker versionCode=6 versionName=1.5.0'
          echo "$expected_manifest"
          grep -F 'package="de.kamilunavo.idlehandwerker"' "$RUNNER_TEMP/manifest.xml"
          grep -F 'android:versionCode="6"' "$RUNNER_TEMP/manifest.xml"
          grep -F 'android:versionName="1.5.0"' "$RUNNER_TEMP/manifest.xml"
          python3 - "$RUNNER_TEMP/manifest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          sys.path.insert(0, "apps/005-idle-handwerker/ci")
          from patch_android_font_scale import has_font_scale
          ns = "{http://schemas.android.com/apk/res/android}"
          activities = ET.parse(sys.argv[1]).findall("application/activity")
          game = next(a for a in activities if a.get(ns + "name", "").endswith(".GodotApp"))
          assert has_font_scale(game.get(ns + "configChanges", "")), "Game must handle font changes without engine destruction"
          PY
          unzip -Z1 "$AAB" > "$RUNNER_TEMP/aab-files.txt"
          grep -Fx 'base/res/mipmap/icon.webp' "$RUNNER_TEMP/aab-files.txt"
          echo 'Launcher icon resource inventory:'
          grep -E '^base/res/(drawable|mipmap)[^/]*/[^/]*icon[^/]*$' "$RUNNER_TEMP/aab-files.txt" || true
          offending_icons=$(grep -E '^base/res/(mipmap-anydpi-v26/(icon|themed_icon)\.xml|mipmap[^/]*/icon_(foreground|background|monochrome)\.|mipmap-[^/]*/icon\.webp)' "$RUNNER_TEMP/aab-files.txt" || true)
          if [ -n "$offending_icons" ]; then
            echo "Adaptive launcher files are forbidden: use the canonical classic icon only." >&2
            printf '%s\n' "$offending_icons" >&2
            exit 1
          fi
          java -jar "$RUNNER_TEMP/bundletool.jar" dump resources --bundle="$AAB" > "$RUNNER_TEMP/resources.txt"
          grep -F 'mipmap/icon' "$RUNNER_TEMP/resources.txt"
          if grep -Eq 'mipmap/icon_(foreground|background|monochrome)' "$RUNNER_TEMP/resources.txt"; then
            echo "Adaptive launcher resources are forbidden: use the canonical classic icon only." >&2
            exit 1
          fi

      - name: Preserve the complete unsigned source and install-time asset pack
        run: python3 .github/scripts/godot_release_payload.py prepare --input "$PROJECT_DIR/builds/android/idle-handwerker-unsigned.aab" --out unsigned
      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: idle-handwerker-unsigned-aab
          path: unsigned/
          if-no-files-found: error
          retention-days: 30

      - name: Capture real Android screenshots
        if: github.event_name != 'workflow_dispatch' || inputs.capture_screenshots
        id: screenshots
        # Godot #109550 can exceed Google SwiftShader's fragment-uniform limit.
        # Keep authentic emulator capture as retained QA without blocking the release AAB.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash apps/005-idle-handwerker/ci/capture_android_screenshots.sh apps/005-idle-handwerker/builds/android/idle-handwerker-screenshots.apk apps/005-idle-handwerker/builds/android/screenshots

      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.capture_screenshots)
        with:
          name: idle-handwerker-android-screenshots
          path: apps/005-idle-handwerker/builds/android/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: steps.screenshots.outcome == 'failure'
        with:
          name: idle-handwerker-android-runtime-diagnostics
          path: |
            apps/005-idle-handwerker/builds/android/idle-handwerker-screenshots.apk
            apps/005-idle-handwerker/builds/android/screenshots/diagnostics/**
          if-no-files-found: error
          retention-days: 14

  persist-main-screenshots:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-screenshot.outputs.screenshot_outcome == 'success'
    needs: build-and-screenshot
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v5
        with:
          name: idle-handwerker-android-screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Persist verified Android screenshots without a trigger loop
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/screenshots"
          target="apps/005-idle-handwerker/play-store/android-screenshots"
          for name in idle-handwerker-home.png idle-handwerker-progress.png idle-handwerker-shop.png; do
            test -s "$source/$name"
          done
          mkdir -p "$target"
          cp "$source"/*.png "$target/"
          git add -- apps/005-idle-handwerker/play-store/android-screenshots
          if git diff --cached --quiet; then
            echo "Verified screenshots are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(idle): persist verified Android screenshots"
          git push origin HEAD:main

  sign-central-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-and-screenshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch the exact immutable unsigned source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.build-and-screenshot.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.build-and-screenshot.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/source-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source-artifact.zip"
          python3 .github/scripts/godot_release_payload.py unpack --archive "$RUNNER_TEMP/source-artifact.zip" --metadata "$RUNNER_TEMP/source-artifact.json" --digest "$SOURCE_ARTIFACT_DIGEST" --artifact-id "$SOURCE_ARTIFACT_ID" --artifact-name idle-handwerker-unsigned-aab --out input
      - name: Validate exact release identity before restoring signing material
        run: |
          set -euo pipefail
          unsigned="$GITHUB_WORKSPACE/input/app.aab"
          test -s "$unsigned"
          python3 .github/scripts/godot_release_payload.py recheck --input input
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum --check -
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$unsigned"
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$unsigned" --xpath=/manifest/@package)" = de.kamilunavo.idlehandwerker
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$unsigned" --xpath=/manifest/@android:versionCode)" = 6
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$unsigned" --xpath=/manifest/@android:versionName)" = 1.5.0

          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$unsigned" --module=assetPackInstallTime > "$RUNNER_TEMP/install-time.xml"
          python3 .github/scripts/godot_release_payload.py pack --input "$RUNNER_TEMP/install-time.xml"

      - name: Restore central upload identity
        uses: acciento89-bot/maengelfix/.github/actions/restore-central-android-signing@14bbf9332ccf58a2304027628da748ff4c6b3e61

      - name: Sign and verify release AAB
        run: |
          set -euo pipefail
          unsigned="$GITHUB_WORKSPACE/input/app.aab"
          signed="$GITHUB_WORKSPACE/signed/idle-handwerker.aab"
          test "$KAMILUNAVO_CENTRAL_UPLOAD_SHA1" = "$CENTRAL_SHA1"
          test "$KAMILUNAVO_CENTRAL_UPLOAD_SHA256" = "$CENTRAL_SHA256"
          mkdir signed
          cp "$unsigned" "$signed"
          jarsigner -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            -keypass "$ANDROID_UPLOAD_KEY_PASSWORD" \
            "$signed" "$ANDROID_UPLOAD_KEY_ALIAS"
          jarsigner -verify "$signed"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$signed"
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$signed" --xpath=/manifest/@package)" = de.kamilunavo.idlehandwerker
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$signed" --xpath=/manifest/@android:versionCode)" = 6
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$signed" --xpath=/manifest/@android:versionName)" = 1.5.0
          keytool -J-Duser.language=en -printcert -jarfile "$signed" > "$RUNNER_TEMP/signing-cert.txt"
          grep -F 'SHA1: BC:F2:33:7D:41:E6:17:C0:3B:CA:E6:98:C0:9D:15:23:65:4B:D7:90' "$RUNNER_TEMP/signing-cert.txt"
          grep -F 'SHA256: 79:85:BD:6B:33:71:1B:AC:A7:E6:BA:72:2C:2B:38:70:EB:BC:80:2F:7D:B4:A7:BC:12:06:BD:AE:51:C4:D5:D6' "$RUNNER_TEMP/signing-cert.txt"
          cp "$RUNNER_TEMP/signing-cert.txt" signed/upload-certificate.txt
          python3 .github/scripts/godot_release_payload.py finish --input input --signed "$signed"
          sha256sum "$signed" > signed/idle-handwerker.aab.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: idle-handwerker-central-signed-aab
          path: signed/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${ANDROID_UPLOAD_KEYSTORE_PATH:-}" ]; then
            rm -f "$ANDROID_UPLOAD_KEYSTORE_PATH"
          fi
          if [ -n "${KAMILUNAVO_SIGNING_WORKDIR:-}" ]; then
            rm -rf "$KAMILUNAVO_SIGNING_WORKDIR"
          fi
