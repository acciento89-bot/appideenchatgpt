name: Trigger Family Life OS Finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-family-ipad-finalizer.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Run Family Life OS finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run family-life-os-ipad-appstore-submit.yml --repo "$GITHUB_REPOSITORY" --ref main
