name: Finalize Family Life OS App Store Metadata Main

on:
  push:
    branches: [main]
    paths: ['.github/workflows/family-life-os-release-metadata-main.yml']

permissions:
  contents: read
  statuses: write

env:
  INFO_LOC_ID: 4200e95c-e36b-4867-b697-e1fe53d61be2
  VERSION_ID: e7a061e3-bd05-453c-a911-00e1e8cb4f76
  VLOC_ID: 557ca16e-28b4-44d0-83ec-11d8890f0376

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          B=$(jq -n --arg u "$U" '{state:"pending",target_url:$u,description:"Family Life OS metadata finalization running",context:"family-life-os/release-metadata-main"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Prepare ASC token
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          echo "ASC_TOKEN=$JWT" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Update App Store Connect
        run: |
          set -euo pipefail
          patch(){ curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $ASC_TOKEN" -H 'Content-Type: application/json' -d "$2" "https://api.appstoreconnect.apple.com$1" >/dev/null; }
          INFO=$(jq -n --arg id "$INFO_LOC_ID" '{data:{type:"appInfoLocalizations",id:$id,attributes:{subtitle:"Familienalltag organisiert",privacyPolicyUrl:"https://www.kamilunavo.com/family/privacy",privacyChoicesUrl:"https://www.kamilunavo.com/family/privacy-choices"}}}')
          patch "/v1/appInfoLocalizations/$INFO_LOC_ID" "$INFO"
          DESCRIPTION=$(cat <<'EOF'
Family Life OS macht aus verstreuten Familieninfos einen gemeinsamen Plan. Erfasse Elternbriefe, Screenshots, PDFs, Text oder Sprache. Die App erkennt Termine, Aufgaben, Fristen und Vorbereitungen und zeigt sie dir zuerst zur Prüfung – erst danach werden sie in den Familienplan übernommen.

• Heute: Was jetzt wichtig ist
• Inbox: Fotos, PDFs, Text und Sprache sammeln
• Import prüfen: erkannte Termine, Aufgaben und Erinnerungen bearbeiten
• Plan: gemeinsame Agenda und Wochenübersicht
• Familie: Mitglieder, Rollen und Einladungen verwalten
• Erinnerungen: Termine, Aufgaben und Vorbereitung
• Family Pro: mehr AI-Importe, Automationen, Speicher und Verlauf

Datenschutz bleibt zentral: private Haushaltsdaten, serverseitige AI-Verarbeitung und keine Werbe-SDKs oder appübergreifendes Tracking.

Datenschutz: https://www.kamilunavo.com/family/privacy
Nutzungsbedingungen: https://www.kamilunavo.com/family/terms
EOF
          )
          VLOC=$(jq -n --arg id "$VLOC_ID" --arg d "$DESCRIPTION" --arg k 'familie,kalender,aufgaben,termine,eltern,organisation,planer,erinnerungen,haushalt,schule' --arg p 'Elternbrief, Screenshot oder Sprachnotiz rein – Termine, Aufgaben und Fristen gemeinsam organisieren.' '{data:{type:"appStoreVersionLocalizations",id:$id,attributes:{description:$d,keywords:$k,promotionalText:$p,supportUrl:"https://www.kamilunavo.com/family/support"}}}')
          patch "/v1/appStoreVersionLocalizations/$VLOC_ID" "$VLOC"
          VER=$(jq -n --arg id "$VERSION_ID" '{data:{type:"appStoreVersions",id:$id,attributes:{copyright:"2026 Piotr Kaminski – Kamilunavo"}}}')
          patch "/v1/appStoreVersions/$VERSION_ID" "$VER"

      - name: Verify values
        run: |
          set -euo pipefail
          I=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appInfoLocalizations/$INFO_LOC_ID")
          V=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersionLocalizations/$VLOC_ID")
          R=$(curl -fsS -H "Authorization: Bearer $ASC_TOKEN" "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$VERSION_ID")
          test "$(jq -r '.data.attributes.privacyPolicyUrl' <<<"$I")" = 'https://www.kamilunavo.com/family/privacy'
          test "$(jq -r '.data.attributes.privacyChoicesUrl' <<<"$I")" = 'https://www.kamilunavo.com/family/privacy-choices'
          test "$(jq -r '.data.attributes.supportUrl' <<<"$V")" = 'https://www.kamilunavo.com/family/support'
          test -n "$(jq -r '.data.attributes.description // empty' <<<"$V")"
          test -n "$(jq -r '.data.attributes.keywords // empty' <<<"$V")"
          test -n "$(jq -r '.data.attributes.promotionalText // empty' <<<"$V")"
          test -n "$(jq -r '.data.attributes.copyright // empty' <<<"$R")"
          echo 'Verified privacy URLs, subtitle, description, keywords, promotional text, support URL and copyright.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          U="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${{ job.status }}" == success ]]; then S=success; D='Family Life OS metadata finalized'; else S=failure; D='Family Life OS metadata finalization failed'; fi
          B=$(jq -n --arg s "$S" --arg d "$D" --arg u "$U" '{state:$s,description:$d,target_url:$u,context:"family-life-os/release-metadata-main"}')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$B" >/dev/null

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
