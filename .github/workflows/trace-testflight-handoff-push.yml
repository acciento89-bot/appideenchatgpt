name: Trace TestFlight Handoff Push

on:
  push:
    branches:
      - docs/trace-testflight-app-record-gate
    paths:
      - '.github/workflows/trace-testflight-handoff-push.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract and run guarded handoff patch
        shell: python
        run: |
          from pathlib import Path
          src = Path('.github/workflows/trace-testflight-handoff-sync.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Record successful TestFlight Build 1 handoff')
          run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(src)) if src[i].strip() == '- name: Verify recorded checkpoint')
          block = src[run_line + 1:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block)
          exec(compile(code, '<handoff-sync>', 'exec'), {})
      - name: Verify recorded checkpoint
        run: |
          grep -q 'TESTFLIGHT BUILD 1 UPLOADED' apps/002-evidaro/PROJECT_STATE.md
          grep -q '32445560808' apps/002-evidaro/PROJECT_STATE.md
          grep -q '96665754912' apps/002-evidaro/PROJECT_STATE.md
          grep -q 'TESTFLIGHT BUILD 1 UPLOADED' docs/APP_FACTORY_STATE.md
          grep -q '69b8a1d99082ff804f2a532c636af3008d79546a' docs/APP_FACTORY_STATE.md
      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/002-evidaro/PROJECT_STATE.md docs/APP_FACTORY_STATE.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: record Trace TestFlight Build 1 upload'
          git push origin HEAD:docs/trace-testflight-app-record-gate
