name: Calc Build 5 TestFlight
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/calc-build5-testflight.yml
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: calc-build5-testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
        - scheme: KalteCalc
          bundle: de.kamilunav.kaltecalc
          app: '6804747292'
          repo: SHK
          ref: 39bbff277dbb46e151560c52b22a0c3004cdf770
          project: KamilunavoSHK.xcodeproj
        - scheme: HeizkoerperCalc
          bundle: de.kamilunavo.heizkorpercalc
          app: '6804748049'
          repo: SHK
          ref: 39bbff277dbb46e151560c52b22a0c3004cdf770
          project: KamilunavoSHK.xcodeproj
        - scheme: RohrCalc
          bundle: de.kamilunavo.rohrcalc
          app: '6804748249'
          repo: SHK
          ref: 39bbff277dbb46e151560c52b22a0c3004cdf770
          project: KamilunavoSHK.xcodeproj
        - scheme: LueftungsCalc
          bundle: de.kamilunavo.luftungscalc
          app: '6804747588'
          repo: SHK
          ref: 39bbff277dbb46e151560c52b22a0c3004cdf770
          project: KamilunavoSHK.xcodeproj
        - scheme: VolumeCalc
          bundle: de.kamilunavo.volumecalc
          app: '6804672773'
          repo: AnlagenVolumen
          ref: 13c66b1540f2bfc090154b3be18ced6d5354eb7d
          project: AnlagenVolumen.xcodeproj
    env:
      APP_ID: ${{ matrix.app }}
      BUNDLE_ID: ${{ matrix.bundle }}
      SCHEME: ${{ matrix.scheme }}
      XCODE_PROJECT: ${{ matrix.project }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/checkout@v5
      with:
        repository: acciento89-bot/${{ matrix.repo }}
        ref: ${{ matrix.ref }}
        path: source
        persist-credentials: false
    - name: Prepare existing Apple API credentials
      env:
        ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      run: |
        set -euo pipefail
        umask 077
        ASC_KEY_PATH="$RUNNER_TEMP/CalcAuth.p8"
        echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
        test -n "$ASC_ISSUER_ID"; test -n "$ASC_KEY_ID"; test -n "$ASC_PRIVATE_KEY_B64"
        printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$ASC_KEY_PATH"
    - name: Inspect current Apple version and avoid duplicate upload
      id: apple
      run: python3 scripts/calc-release/asc.py
    - name: Generate SHK Xcode project
      if: matrix.repo == 'SHK' && steps.apple.outputs.exists != 'true'
      working-directory: source
      run: |-
        brew install xcodegen
        python3 scripts/generate_app_icon.py --app "$(echo "$SCHEME" | tr "[:upper:]" "[:lower:]")" --source-dir "Apps/$SCHEME"
        xcodegen generate
    - name: Archive verified build 5
      if: steps.apple.outputs.exists != 'true'
      working-directory: source
      run: |
        set -euo pipefail
        xcodebuild -project "$XCODE_PROJECT" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Calc.xcarchive" DEVELOPMENT_TEAM=TKG684N5GL CURRENT_PROJECT_VERSION=5 MARKETING_VERSION=1.0 ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
        APP="$RUNNER_TEMP/Calc.xcarchive/Products/Applications/$SCHEME.app"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '5'
    - name: Export and upload using existing Apple signing access
      if: steps.apple.outputs.exists != 'true'
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import os,plistlib
        with open(os.environ['RUNNER_TEMP']+'/Export.plist','wb') as f:
         plistlib.dump(dict(method='app-store-connect',destination='upload',signingStyle='automatic',teamID='TKG684N5GL',uploadSymbols=True,manageAppVersionAndBuildNumber=False),f)
        PYCODE
        xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Calc.xcarchive" -exportPath "$RUNNER_TEMP/CalcExport" -exportOptionsPlist "$RUNNER_TEMP/Export.plist" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
    - name: Remove temporary credential file
      if: always()
      run: rm -f "$ASC_KEY_PATH"
