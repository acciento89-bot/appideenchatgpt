name: Rapport AI Validate

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/012-rapport-ai/**"
      - ".github/workflows/rapport-ai-validate.yml"
  pull_request:
    paths:
      - "apps/012-rapport-ai/**"
      - ".github/workflows/rapport-ai-validate.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect project
        run: xcodebuild -project apps/012-rapport-ai/prototype/RapportAI.xcodeproj -scheme RapportAI -list
      - name: Build iPhone simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project apps/012-rapport-ai/prototype/RapportAI.xcodeproj \
            -scheme RapportAI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
      - name: Validate privacy and secrets boundary
        run: |
          test -f apps/012-rapport-ai/prototype/RapportAI/PrivacyInfo.xcprivacy
          test -f apps/012-rapport-ai/prototype/RapportAI/StoreKit/RapportAI.storekit
          test -f apps/012-rapport-ai/prototype/RapportAI/Assets.xcassets/AppIcon.appiconset/RapportAI-AppIcon-1024.png
          test "$(sips -g pixelWidth -g pixelHeight apps/012-rapport-ai/prototype/RapportAI/Assets.xcassets/AppIcon.appiconset/RapportAI-AppIcon-1024.png | awk '/pixelWidth|pixelHeight/ { print $2 }' | tr '\n' ' ')" = "1024 1024 "
          ! grep -R -E -n 'sk-[A-Za-z0-9_-]{20,}' apps/012-rapport-ai
          grep -n 'OPENAI_API_KEY' apps/012-rapport-ai/supabase/functions/generate-rapport/index.ts
