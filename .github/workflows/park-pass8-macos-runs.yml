name: Finalize Pass 8 handoff after Pass 7 merge

on:
  push:
    branches:
      - agent/002-evidaro-offline-verifier
    paths:
      - '.github/workflows/park-pass8-macos-runs.yml'

permissions:
  contents: write

jobs:
  finalize-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Pass 8 branch
        uses: actions/checkout@v5
        with:
          ref: agent/002-evidaro-offline-verifier
          fetch-depth: 0

      - name: Record Pass 7 merge and Pass 8 final-gate state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:90]!r}")
              path.write_text(text.replace(old, new, 1))

          project = Path('apps/002-evidaro/PROJECT_STATE.md')
          replace_exact(
              project,
              'Status: ACTIVE — PASS 7 FINAL EXACT-HEAD GATE QUEUED / PASS 8 OFFLINE VERIFIER IMPLEMENTED, OWN GATE PENDING',
              'Status: ACTIVE — PASS 7 GREEN / MERGED; PASS 8 OFFLINE VERIFIER IMPLEMENTED / FINAL EXACT-HEAD GATE PENDING'
          )
          replace_exact(
              project,
              '## Pass 7 — DE/EN + ACCESSIBILITY + LOCALIZED PDF — IMPLEMENTED / FINAL GATE QUEUED',
              '## Pass 7 — DE/EN + ACCESSIBILITY + LOCALIZED PDF — GREEN / MERGED'
          )
          replace_exact(
              project,
              'PR #29 `Add Evidaro DE/EN localization and accessibility hardening` is OPEN/DRAFT on branch `agent/002-evidaro-localization-accessibility`.',
              'PR #29 `Add Evidaro DE/EN localization and accessibility hardening` — MERGED.'
          )
          replace_exact(
              project,
              '''Final exact documentation-aligned head:\n- `79c132f31ca2ce13046e5941f872087dfc7dad07`\n- workflow run `32369937142` / run #43\n- build job `96427918180`\n- current observed status on 2026-08-20: **QUEUED**; no failure/conclusion yet\n- do not merge while this exact gate is queued''',
              '''Final verified Pass-7 gate:\n- final PR head `84ef850678551e7cb0f22004c05e070adabece9d`\n- workflow run `32383741929` / run #82 — **SUCCESS**\n- build job `96473002571` — **SUCCESS**\n- preflight — SUCCESS\n- Xcode iOS Simulator build — SUCCESS\n- persistence + OCR + English PDF + German PDF + privacy lock + German localization process-relaunch gate — SUCCESS\n- merge commit `bf3ecf74887c08d52bbadf11a13174c83133b093`'''
          )
          replace_exact(
              project,
              '''Pass-7 merge rule:\n- do not merge PR #29 until exact head `79c132f31ca2ce13046e5941f872087dfc7dad07` passes preflight + Xcode build + persistence + OCR + English PDF + German PDF + privacy-lock + German localization checks''',
              '''Pass-7 completion:\n- exact final head `84ef850678551e7cb0f22004c05e070adabece9d` passed the full gate and PR #29 was merged to `main` as `bf3ecf74887c08d52bbadf11a13174c83133b093`'''
          )
          replace_exact(
              project,
              '''Follow-up branch:\n- `agent/002-evidaro-offline-verifier`\n- branched from exact Pass-7 head `79c132f31ca2ce13046e5941f872087dfc7dad07`\n- no PR opened yet; keep it as a clean dependent follow-up until Pass 7 is merged''',
              '''Pass-8 PR / branch:\n- PR #32 `Add offline-verifiable evidence bundles` — OPEN/DRAFT\n- branch `agent/002-evidaro-offline-verifier`\n- synchronized with merged Pass 7 / `main` through merge commit `5ec036f849de4dc7a63ef6d9acd82e7d493bc268`\n- final exact-head full macOS gate pending'''
          )
          replace_exact(
              project,
              'Pass-8 is **not green yet**. The combined Xcode/simulator gate must run on a final documentation-aligned Pass-8 head after Pass 7 is merged / the follow-up PR can target clean `main`.',
              'Pass-8 is **not green yet**. The branch now includes merged Pass 7; the combined Xcode/simulator gate must pass on the final documentation-aligned Pass-8 head before PR #32 can merge.'
          )

          factory = Path('docs/APP_FACTORY_STATE.md')
          replace_exact(
              factory,
              '| 002 | Evidaro (INTERNAL/PROVISIONAL; ProofVault retired) | Local-first evidence cases + original hashes + snapshot seals + localized PDF + offline `.evpack` verifier | Freemium + likely Lifetime Pro | ACTIVE — PASS 7 FINAL GATE QUEUED; PASS 8 OFFLINE VERIFIER SOURCE IMPLEMENTED / OWN GATE PENDING; RELEASE RENAME REQUIRED |',
              '| 002 | Evidaro (INTERNAL/PROVISIONAL; ProofVault retired) | Local-first evidence cases + original hashes + snapshot seals + localized PDF + offline `.evpack` verifier | Freemium + likely Lifetime Pro | ACTIVE — PASS 7 GREEN/MERGED; PASS 8 OFFLINE VERIFIER FINAL GATE PENDING; RELEASE RENAME REQUIRED |'
          )
          replace_exact(
              factory,
              '''Current Pass 7:\n\n- PR #29 `Add Evidaro DE/EN localization and accessibility hardening` — OPEN/DRAFT\n- branch `agent/002-evidaro-localization-accessibility`\n- final documentation-aligned head `79c132f31ca2ce13046e5941f872087dfc7dad07`\n- exact workflow run `32369937142` / run #43\n- build job `96427918180`\n- observed 2026-08-20 status: **QUEUED**, no failure/conclusion yet\n- earlier source head `ae6a3b8fbdf25eca08ac040ce614664f5fd718de` had workflow run `32362074699` — SUCCESS / build job `96403585360` — SUCCESS''',
              '''Pass 7 — GREEN / MERGED:\n\n- PR #29 `Add Evidaro DE/EN localization and accessibility hardening` — MERGED\n- final PR head `84ef850678551e7cb0f22004c05e070adabece9d`\n- exact workflow run `32383741929` / run #82 — **SUCCESS**\n- build job `96473002571` — **SUCCESS**\n- merge commit `bf3ecf74887c08d52bbadf11a13174c83133b093`'''
          )
          replace_exact(
              factory,
              '''Pass-7 rule:\n- keep exact head `79c132f31ca2ce13046e5941f872087dfc7dad07` frozen\n- do not merge PR #29 while workflow `32369937142` is queued\n- merge only after preflight, Xcode Simulator, persistence, OCR, English PDF, German PDF, privacy lock and German runtime localization all conclude SUCCESS on that exact head''',
              '''Pass-7 completion:\n- final head `84ef850678551e7cb0f22004c05e070adabece9d` passed preflight, Xcode Simulator, persistence, OCR, English PDF, German PDF, privacy lock and German runtime localization before merge'''
          )
          replace_exact(
              factory,
              '''Current Pass 8 — offline-verifiable `.evpack`:\n\n- dependent follow-up branch `agent/002-evidaro-offline-verifier`\n- branched from exact Pass-7 head `79c132f31ca2ce13046e5941f872087dfc7dad07`\n- no PR yet; keep Pass 8 separate until Pass 7 merges\n- source implementation exists; own Xcode/simulator gate is still pending''',
              '''Current Pass 8 — offline-verifiable `.evpack`:\n\n- PR #32 `Add offline-verifiable evidence bundles` — OPEN/DRAFT\n- branch `agent/002-evidaro-offline-verifier`\n- synchronized with merged Pass 7 / current `main` through merge commit `5ec036f849de4dc7a63ef6d9acd82e7d493bc268`\n- source implementation exists; final exact-head Xcode/simulator gate is pending'''
          )
          replace_exact(
              factory,
              'Do not regress #002 to `ProofVault`, `QUEUED`, Foundation-only, pre-OCR, pre-PDF, pre-privacy-lock or pre-Pass-7 state. Do not call Pass 7 or Pass 8 green while their relevant exact-head gates have not concluded SUCCESS.',
              'Do not regress #002 to `ProofVault`, `QUEUED`, Foundation-only, pre-OCR, pre-PDF, pre-privacy-lock or pre-Pass-7 state. Pass 7 is GREEN/MERGED. Do not call Pass 8 green until its final exact-head gate concludes SUCCESS.'
          )
          PY

      - name: Commit authoritative handoff update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/002-evidaro/PROJECT_STATE.md docs/APP_FACTORY_STATE.md
          git diff --cached --quiet && { echo 'No handoff changes to commit'; exit 0; }
          git commit -m 'Record Pass 7 merge before Pass 8 gate'
          git push origin HEAD:agent/002-evidaro-offline-verifier
