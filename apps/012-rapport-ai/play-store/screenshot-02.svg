<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#061925"/><text x="540" y="115" text-anchor="middle" fill="#2DC3E8" font-family="Arial" font-size="32" font-weight="700" letter-spacing="3">KLAR UND PROFESSIONELL</text><text x="540" y="185" text-anchor="middle" fill="white" font-family="Arial" font-size="54" font-weight="800">Fertiger Rapport in Sekunden</text>
  <rect x="80" y="255" width="920" height="1450" rx="64" fill="#0B2230" stroke="#1C6380" stroke-width="4"/><text x="540" y="340" text-anchor="middle" fill="white" font-family="Arial" font-size="38" font-weight="700">Neuer Rapport</text>
  <rect x="130" y="410" width="820" height="1000" rx="30" fill="#102F40"/><circle cx="185" cy="480" r="25" fill="#2DC3E8"/><path d="M173 480l9 10 18-23" fill="none" stroke="#061925" stroke-width="8" stroke-linecap="round"/><text x="230" y="492" fill="#2DC3E8" font-family="Arial" font-size="31" font-weight="700">Fertiger Rapport</text><rect x="720" y="452" width="175" height="50" rx="25" fill="#2B3B43"/><text x="807" y="485" text-anchor="middle" fill="#FF8614" font-family="Arial" font-size="20" font-weight="700">BEARBEITBAR</text>
  <rect x="170" y="545" width="740" height="590" rx="18" fill="#071B29"/><text x="205" y="610" fill="white" font-family="Arial" font-size="27" font-weight="700">Arbeitsrapport</text><text x="205" y="665" fill="#D9E7ED" font-family="Arial" font-size="25">Vor Ort wurde die gemeldete</text><text x="205" y="708" fill="#D9E7ED" font-family="Arial" font-size="25">Undichtigkeit an der Waschtischarmatur</text><text x="205" y="751" fill="#D9E7ED" font-family="Arial" font-size="25">geprüft. Die Anschlüsse wurden</text><text x="205" y="794" fill="#D9E7ED" font-family="Arial" font-size="25">kontrolliert und fachgerecht nachgezogen.</text><text x="205" y="857" fill="#D9E7ED" font-family="Arial" font-size="25">Anschließend erfolgte eine Funktions-</text><text x="205" y="900" fill="#D9E7ED" font-family="Arial" font-size="25">und Dichtheitskontrolle.</text><text x="205" y="1010" fill="#A8C1CC" font-family="Arial" font-size="23">Jedes Wort kann vor dem Speichern</text><text x="205" y="1048" fill="#A8C1CC" font-family="Arial" font-size="23">bearbeitet und fachlich geprüft werden.</text>
  <rect x="170" y="1180" width="350" height="110" rx="25" fill="#123B50" stroke="#2DC3E8" stroke-width="3"/><text x="345" y="1248" text-anchor="middle" fill="white" font-family="Arial" font-size="28" font-weight="700">Speichern</text><rect x="560" y="1180" width="350" height="110" rx="25" fill="#FF8614"/><text x="735" y="1248" text-anchor="middle" fill="white" font-family="Arial" font-size="28" font-weight="700">PDF teilen</text>
  <text x="540" y="1805" text-anchor="middle" fill="#D9E7ED" font-family="Arial" font-size="34">Prüfen, bearbeiten, speichern und teilen.</text>
</svg>